-ochre)"/><path d="M 738.8698059628387 547.5328890437411 L 469.13019403716135 547.5328890437411" fill="none" stroke="#a74c2b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 285.52236954527274 463.31185801541665 L 273.17207464732326 447.92673687557044" fill="none" stroke="#a74c2b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 304.1688846829712 326.99704925110365 L 488.712369471069 272.7271033129446" fill="none" stroke="#a74c2b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><g><rect x="500" y="180" width="200" height="120" rx="48" fill="#fffefb" stroke="#0c5965" stroke-width="3"/><text x="600" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#17323b" text-anchor="middle"><tspan x="600" dy="0">Design</tspan></text><text x="600" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#526a73" text-anchor="middle"><tspan x="600" dy="0">Choose a response to</tspan><tspan x="600" dy="15.93">need and constraints</tspan></text></g><g><rect x="899.4437368439644" y="297.4671109562589" width="200" height="120" rx="48" fill="#dcecef" stroke="#0c5965" stroke-width="3"/><text x="999.4437368439644" y="334.4671109562589" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#17323b" text-anchor="middle"><tspan x="999.4437368439644" dy="0">Make</tspan></text><text x="999.4437368439644" y="364.4671109562589" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#526a73" text-anchor="middle"><tspan x="999.4437368439644" dy="0">Produce under</tspan><tspan x="999.4437368439644" dy="15.93">teacher-authorised</tspan><tspan x="999.4437368439644" dy="15.93">conditions</tspan></text></g><g><rect x="746.8698059628387" y="487.5328890437411" width="200" height="120" rx="48" fill="#fffefb" stroke="#0c5965" stroke-width="3"/><text x="846.8698059628387" y="524.5328890437411" font-