<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Quality can reduce resource waste</title><desc id="desc">A longer useful life may matter more than a token recycled feature.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Quality can reduce resource waste</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">A longer useful life may matter more than a token recycled feature.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><path d="M 470 375 L 470 420 L 295 420 L 295 458" fill="none" stroke="#4b7663" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><path d="M 730 375 L 730 420 L 905 420 L 905 458" fill="none" stroke="#a74c2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ochre)"/><g><rect x="310" y="210" width="580" height="165" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="310" y="210" width="10" height="165" rx="5" fill="#0c5965"/><text x="338" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="338" dy="0">Design choice</tspan></text><text x="338" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="338" dy="0">Does it improve function, durability or repair?</tspan></text></g><g><rect x="55" y="465" width="500" height="170" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="55" y="465" width="10" height="170" rx="5" fill="#4b7663"/><text x="83" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="83" dy="0">Yes</tspan></text><text x="83" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="83" dy="0">Explain the likely resource benefit and trade-off</tspan></text></g><g><rect x="645" y="465" width="500" height="170" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="645" y="465" width="10" height="170" rx="5" fill="#a74c2b"/><text x="673" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="673" dy="0">No or uncertain</tspan></text><text x="673" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="673" dy="0">Look for stronger evidence or a more meaningful</tspan><tspan x="673" dy="21.96">change</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>