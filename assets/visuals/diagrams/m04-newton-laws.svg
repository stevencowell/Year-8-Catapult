<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Newton&apos;s laws through a catapult lens</title><desc id="desc">Each law answers a different question about changing motion.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Newton&apos;s laws through a catapult lens</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Each law answers a different question about changing motion.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="60" y="210" width="510" height="180" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="60" y="210" width="10" height="180" rx="5" fill="#0c5965"/><text x="88" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="88" dy="0">First law</tspan></text><text x="88" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="88" dy="0">Why motion stays unchanged unless a net force acts</tspan></text></g><g><rect x="610" y="210" width="510" height="180" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="610" y="210" width="10" height="180" rx="5" fill="#a74c2b"/><text x="638" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="638" dy="0">Second law</tspan></text><text x="638" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="638" dy="0">How net force, mass and acceleration relate</tspan></text></g><g><rect x="60" y="412" width="510" height="180" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="60" y="412" width="10" height="180" rx="5" fill="#0c5965"/><text x="88" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="88" dy="0">Third law</tspan></text><text x="88" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="88" dy="0">Why interaction forces come in equal and opposite</tspan><tspan x="88" dy="21.96">pairs</tspan></text></g><g><rect x="610" y="412" width="510" height="180" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="610" y="412" width="10" height="180" rx="5" fill="#a74c2b"/><text x="638" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="638" dy="0">Important distinction</tspan></text><text x="638" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="638" dy="0">Third-law forces act on different objects</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>