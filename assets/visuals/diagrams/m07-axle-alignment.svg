<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Paired supports must agree</title><desc id="desc">Alignment affects friction, movement and wear.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Paired supports must agree</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Alignment affects friction, movement and wear.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="480" y="285" width="70" height="190" rx="12" fill="#dcecef" stroke="#0c5965" stroke-width="5"/><rect x="650" y="285" width="70" height="190" rx="12" fill="#dcecef" stroke="#0c5965" stroke-width="5"/><path d="M500 380 H700" stroke="#a74c2b" stroke-width="16" stroke-linecap="round"/><circle cx="600" cy="380" r="62" fill="#fffefb" stroke="#0c5965" stroke-width="6"/><circle cx="600" cy="380" r="18" fill="#a74c2b"/><path d="M500 350 H700" stroke="#9db4bb" stroke-width="3" stroke-dasharray="10 9"/><path d="M555 465 H645" stroke="#4b7663" stroke-width="5"/><path d="M555 455 V475 M645 455 V475" stroke="#4b7663" stroke-width="5"/></g><path d="M 345 265 L 500 350" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="500" cy="350" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 265 L 685 320" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="685" cy="320" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 345 408 L 645 465" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="645" cy="465" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 408 L 515 380" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="515" cy="380" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 345 551 L 600 380" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="600" cy="380" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><g><rect x="45" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="205" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Shared centreline</tspan></text><text x="73" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Both supports refer to the</tspan><tspan x="73" dy="19.52">same axis</tspan></text></g><g><rect x="855" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="205" width="10" height="120" rx="5" fill="#a74c2b"/><text x="883" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Parallel faces</tspan></text><text x="883" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Reduce sideways binding</tspan></text></g><g><rect x="45" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Clearance</tspan></text><text x="73" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Enough space for movement</tspan><tspan x="73" dy="19.52">without looseness</tspan></text></g><g><rect x="855" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="883" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Axle support</tspan></text><text x="883" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Carries the rotating</tspan><tspan x="883" dy="19.52">component</tspan></text></g><g><rect x="45" y="491" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="491" width="10" height="120" rx="5" fill="#a74c2b"/><text x="73" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Check by observation</tspan></text><text x="73" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Look for smooth, centred</tspan><tspan x="73" dy="19.52">motion</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>