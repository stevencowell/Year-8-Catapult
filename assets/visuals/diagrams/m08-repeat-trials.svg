<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">One trial is an event; repeats can reveal a pattern</title><desc id="desc">Compare consistency as well as the central result.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">One trial is an event; repeats can reveal a pattern</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Compare consistency as well as the central result.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><path d="M 129 270 L 273 270" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 345 270 L 489 270" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 561 270 L 705 270" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 777 270 L 921 270" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><g><circle cx="89" cy="270" r="30" fill="#0c5965"/><text x="89" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle"><tspan x="89" dy="0">1</tspan></text><text x="55" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="55" dy="0">Trial 1</tspan></text><text x="55" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="55" dy="0">Record using agreed</tspan><tspan x="55" dy="19.2">categories</tspan></text></g><g><circle cx="305" cy="270" r="30" fill="#a74c2b"/><text x="305" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle"><tspan x="305" dy="0">2</tspan></text><text x="271" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="271" dy="0">Trial 2</tspan></text><text x="271" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="271" dy="0">Repeat under the same</tspan><tspan x="271" dy="19.2">controlled conditions</tspan></text></g><g><circle cx="521" cy="270" r="30" fill="#0c5965"/><text x="521" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle"><tspan x="521" dy="0">3</tspan></text><text x="487" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="487" dy="0">Trial 3</tspan></text><text x="487" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="487" dy="0">Repeat again and note</tspan><tspan x="487" dy="19.2">variation</tspan></text></g><g><circle cx="737" cy="270" r="30" fill="#a74c2b"/><text x="737" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle"><tspan x="737" dy="0">4</tspan></text><text x="703" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="703" dy="0">Compare</tspan></text><text x="703" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="703" dy="0">Look for pattern,</tspan><tspan x="703" dy="19.2">spread and anomalies</tspan></text></g><g><circle cx="953" cy="270" r="30" fill="#0c5965"/><text x="953" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle"><tspan x="953" dy="0">5</tspan></text><text x="919" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="919" dy="0">Conclude</tspan></text><text x="919" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="919" dy="0">Make a cautious claim</tspan><tspan x="919" dy="19.2">supported by the set</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>