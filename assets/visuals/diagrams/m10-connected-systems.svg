<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Engineering systems connect people, place and purpose</title><desc id="desc">Technical function is only one part of understanding a system.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Engineering systems connect people, place and purpose</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Technical function is only one part of understanding a system.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="90" y="205" width="1020" height="76" rx="18" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><circle cx="135" cy="243" r="20" fill="#0c5965"/><text x="175" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="175" dy="0">Components and flows</tspan></text><text x="465" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="465" dy="0">Materials, energy and information interact</tspan></text></g><g><rect x="90" y="289" width="1020" height="76" rx="18" fill="#dcecef" stroke="#9db4bb" stroke-width="2"/><circle cx="135" cy="327" r="20" fill="#a74c2b"/><text x="175" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="175" dy="0">Environment</tspan></text><text x="465" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="465" dy="0">Land, water and other conditions matter</tspan></text></g><g><rect x="90" y="373" width="1020" height="76" rx="18" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><circle cx="135" cy="411" r="20" fill="#0c5965"/><text x="175" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="175" dy="0">Knowledge and care</tspan></text><text x="465" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="465" dy="0">Systems depend on observation and maintenance</tspan></text></g><g><rect x="90" y="457" width="1020" height="76" rx="18" fill="#dcecef" stroke="#9db4bb" stroke-width="2"/><circle cx="135" cy="495" r="20" fill="#a74c2b"/><text x="175" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="175" dy="0">Community and purpose</tspan></text><text x="465" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="465" dy="0">Values shape why and how systems operate</tspan></text></g><g><rect x="90" y="541" width="1020" height="76" rx="18" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><circle cx="135" cy="579" r="20" fill="#0c5965"/><text x="175" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="175" dy="0">Cultural authority</tspan></text><text x="465" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="465" dy="0">Use authoritative knowledge holders and context</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>