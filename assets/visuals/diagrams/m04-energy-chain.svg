<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Energy changes form through the system</title><desc id="desc">Energy is transferred; some spreads into less useful forms.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Energy changes form through the system</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Energy is transferred; some spreads into less useful forms.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><path d="M 312 370 L 330 370" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 589 370 L 607 370" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><path d="M 866 370 L 884 370" fill="none" stroke="#a74c2b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ochre)"/><g><rect x="60" y="220" width="249" height="300" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="60" y="220" width="10" height="300" rx="5" fill="#0c5965"/><text x="88" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="88" dy="0">Stored energy</tspan></text><text x="88" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="88" dy="0">Elastic potential energy</tspan></text></g><g><rect x="337" y="220" width="249" height="300" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="337" y="220" width="10" height="300" rx="5" fill="#a74c2b"/><text x="365" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="365" dy="0">Moving mechanism</tspan></text><text x="365" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="365" dy="0">Kinetic energy in</tspan><tspan x="365" dy="18.3">components</tspan></text></g><g><rect x="614" y="220" width="249" height="300" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="614" y="220" width="10" height="300" rx="5" fill="#0c5965"/><text x="642" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="642" dy="0">Moving object</tspan></text><text x="642" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="642" dy="0">Kinetic energy in the</tspan><tspan x="642" dy="18.3">launched object</tspan></text></g><g><rect x="891" y="220" width="249" height="300" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="891" y="220" width="10" height="300" rx="5" fill="#a74c2b"/><text x="919" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="919" dy="0">Surroundings</tspan></text><text x="919" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="919" dy="0">Sound, heat, vibration</tspan><tspan x="919" dy="18.3">and air movement</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>