xt x="883" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Pivot or fulcrum</tspan></text><text x="883" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">The turning point</tspan></text></g><g><rect x="45" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Load</tspan></text><text x="73" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">The resistance being moved</tspan></text></g><g><rect x="855" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="883" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Effort arm</tspan></text><text x="883" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Distance from effort to</tspan><tspan x="883" dy="19.52">pivot</tspan></text></g><g><rect x="45" y="491" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="491" width="10" height="120" rx="5" fill="#a74c2b"/><text x="73" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Load arm</tspan></text><text x="73" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Distance