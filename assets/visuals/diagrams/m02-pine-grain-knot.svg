<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Wood is not uniform</title><desc id="desc">Grain direction and knots can change how a pine component behaves.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Wood is not uniform</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Grain direction and knots can change how a pine component behaves.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="455" y="270" width="290" height="190" rx="12" fill="#ead3a5" stroke="#0c5965" stroke-width="4"/><path d="M480 300 C545 280 610 320 720 295 M480 340 C555 315 630 355 720 330 M480 385 C550 360 635 410 720 375 M480 425 C555 400 640 440 720 415" fill="none" stroke="#a9773f" stroke-width="5" stroke-linecap="round"/><ellipse cx="650" cy="350" rx="38" ry="29" fill="#b87a45" stroke="#7d4b27" stroke-width="5"/><path d="M455 270 L488 290 L488 440 L455 460 Z" fill="#d8b97f" stroke="#0c5965" stroke-width="3"/></g><path d="M 345 265 L 535 300" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="535" cy="300" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 265 L 650 350" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="650" cy="350" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 345 408 L 470 420" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="470" cy="420" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 408 L 715 415" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="715" cy="415" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><g><rect x="45" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="205" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Grain direction</tspan></text><text x="73" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Long fibres influence</tspan><tspan x="73" dy="19.52">strength and splitting</tspan></text></g><g><rect x="855" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="205" width="10" height="120" rx="5" fill="#a74c2b"/><text x="883" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Knot</tspan></text><text x="883" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Local grain changes around a</tspan><tspan x="883" dy="19.52">former branch</tspan></text></g><g><rect x="45" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">End grain</tspan></text><text x="73" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Different surface behaviour</tspan><tspan x="73" dy="19.52">at the cut end</tspan></text></g><g><rect x="855" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="883" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Inspection</tspan></text><text x="883" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Check the actual piece</tspan><tspan x="883" dy="19.52">before choosing its role</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>