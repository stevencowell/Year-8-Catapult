<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A dimension communicates intent</title><desc id="desc">Place dimensions where they reduce ambiguity and support checking.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">A dimension communicates intent</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">Place dimensions where they reduce ambiguity and support checking.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="505" y="305" width="190" height="135" fill="#dcecef" stroke="#0c5965" stroke-width="5"/><path d="M505 275 V465 M695 275 V465 M520 270 H680" fill="none" stroke="#9db4bb" stroke-width="4"/><path d="M520 270 L540 260 M520 270 L540 280 M680 270 L660 260 M680 270 L660 280" fill="none" stroke="#a74c2b" stroke-width="5"/><rect x="558" y="238" width="84" height="38" rx="19" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><text x="600" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="900" fill="#17323b" text-anchor="middle"><tspan x="600" dy="0">VALUE</tspan></text><circle cx="505" cy="440" r="8" fill="#a74c2b"/><path d="M530 470 L675 470" stroke="#526a73" stroke-width="4" stroke-dasharray="10 10"/></g><path d="M 345 265 L 505 300" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="505" cy="300" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 265 L 675 270" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="675" cy="270" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 345 408 L 558 255" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="558" cy="255" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 855 408 L 505 440" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="505" cy="440" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><path d="M 345 551 L 675 470" fill="none" stroke="#9db4bb" stroke-width="3" stroke-linecap="round"/><circle cx="675" cy="470" r="6" fill="#a74c2b" stroke="#fffefb" stroke-width="2"/><g><rect x="45" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="205" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Extension lines</tspan></text><text x="73" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">Show which feature is</tspan><tspan x="73" dy="19.52">measured</tspan></text></g><g><rect x="855" y="205" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="205" width="10" height="120" rx="5" fill="#a74c2b"/><text x="883" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Dimension line</tspan></text><text x="883" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Shows the direction of</tspan><tspan x="883" dy="19.52">measurement</tspan></text></g><g><rect x="45" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="73" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Value and unit</tspan></text><text x="73" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">States the intended size</tspan></text></g><g><rect x="855" y="348" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="855" y="348" width="10" height="120" rx="5" fill="#0c5965"/><text x="883" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="883" dy="0">Reference point</tspan></text><text x="883" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="883" dy="0">Keeps measurements</tspan><tspan x="883" dy="19.52">consistent</tspan></text></g><g><rect x="45" y="491" width="300" height="120" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="45" y="491" width="10" height="120" rx="5" fill="#a74c2b"/><text x="73" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="73" dy="0">Avoid duplication</tspan></text><text x="73" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="73" dy="0">One controlling dimension</tspan><tspan x="73" dy="19.52">prevents conflict</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>