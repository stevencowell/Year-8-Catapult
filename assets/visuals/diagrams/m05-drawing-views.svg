<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Different views answer different questions</title><desc id="desc">A buildable design needs more than one picture.</desc><defs><marker id="arrow-ochre" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a74c2b"/></marker><marker id="arrow-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9db4bb"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0c5965"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b7663"/></marker><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 Q12 6 24 18" fill="none" stroke="#d7e4e7" stroke-width="2"/></pattern></defs><rect width="1200" height="675" fill="#f1f6f7"/><rect width="1200" height="675" fill="url(#grain)" opacity=".45"/><rect x="0" y="0" width="20" height="675" fill="#efb84c"/><text x="60" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="900" fill="#17323b" text-anchor="start"><tspan x="60" dy="0">Different views answer different questions</tspan></text><text x="60" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="60" dy="0">A buildable design needs more than one picture.</tspan></text><path d="M60 166 H1140" stroke="#9db4bb" stroke-width="2"/><g><rect x="60" y="210" width="510" height="185" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="60" y="210" width="10" height="185" rx="5" fill="#0c5965"/><text x="88" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="88" dy="0">Pictorial view</tspan></text><text x="88" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="88" dy="0">What the whole idea looks like — Communicates form</tspan><tspan x="88" dy="21.96">and relationships</tspan></text></g><g><rect x="610" y="210" width="510" height="185" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="610" y="210" width="10" height="185" rx="5" fill="#a74c2b"/><text x="638" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="638" dy="0">Orthographic views</tspan></text><text x="638" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="638" dy="0">Front, top and side — Communicate shape without</tspan><tspan x="638" dy="21.96">perspective</tspan></text></g><g><rect x="60" y="417" width="510" height="185" rx="20" fill="#fffefb" stroke="#9db4bb" stroke-width="2"/><rect x="60" y="417" width="10" height="185" rx="5" fill="#0c5965"/><text x="88" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#17323b" text-anchor="start"><tspan x="88" dy="0">Detail view</tspan></text><text x="88" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526a73" text-anchor="start"><tspan x="88" dy="0">A selected feature at larger scale — Clarifies a</tspan><tspan x="88" dy="21.96">joint, hole or interface</tspan></text></g><text x="1140" y="655" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526a73">CATAPULT CONCEPT DIAGRAM</text></svg>